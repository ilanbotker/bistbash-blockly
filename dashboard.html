<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>לוח מחוונים</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 0;
      direction: rtl;
    }
    header {
      background-color: #1976d2;
      color: white;
      padding: 1em;
      text-align: center;
    }
    main {
      padding: 2em;
      text-align: center;
    }
    .welcome {
      font-size: 24px;
      margin-bottom: 1em;
    }
  </style>
</head>
<body>
  <header>
    <h1>מערכת התרגול - לוח מחוונים</h1>
  </header>
  <main>
    <div class="welcome" id="welcome">שלום!</div>
    <p>כאן יוצגו השלבים וההתקדמות של המשתמש.</p>
  </main>

  <script>
    const name = localStorage.getItem("userName");
    const personalId = localStorage.getItem("personalId");
    if (!name || !personalId) {
      window.location.href = "index.html";
    } else {
      document.getElementById("welcome").textContent = `שלום, ${name}!`;
    }
  </script>
</body>
</html>
