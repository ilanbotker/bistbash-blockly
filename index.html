<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Blockly בעברית עם פייתון</title>
  <script src="blockly/blockly_compressed.js"></script>
  <script src="blockly/blocks_compressed.js"></script>
  <script src="blockly/python_compressed.js"></script>
  <script src="blockly/msg/js/he.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      direction: rtl;
      font-family: sans-serif;
    }
    #blocklyDiv {
      height: calc(100% - 100px);
      width: 100%;
    }
    #controls {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1em;
      background: #f0f0f0;
    }
    #logo {
      height: 48px;
      padding: 5px;
    }
    #buttons {
      display: flex;
      gap: 1em;
    }
    #codeArea {
      white-space: pre-wrap;
      background: #f8f8f8;
      padding: 1em;
      font-family: monospace;
      border-top: 1px solid #ccc;
      direction: ltr;
    }
  </style>
</head>
<body>
  <div id="controls">
    <img id="logo" src="Techni Logo.png" alt="לוגו" />
    <div id="buttons">
      <button onclick="showCode()">הצג קוד פייתון בתצוגה</button>
      <button onclick="runCode()">הצג קוד פייתון בחלונית</button>
    </div>
  </div>

  <div id="blocklyDiv"></div>
  <pre id="codeArea"></pre>

  <xml id="toolbox" style="display: none">
    <category name="לוגיקה">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_negate"></block>
      <block type="logic_boolean"></block>
    </category>
    <category name="לולאות">
      <block type="controls_repeat_ext"></block>
      <block type="controls_whileUntil"></block>
      <block type="controls_for"></block>
    </category>
    <category name="מתמטיקה">
      <block type="math_number"></block>
      <block type="math_arithmetic"></block>
    </category>
    <category name="טקסט">
      <block type="text"></block>
      <block type="text_print"></block>
    </category>
    <category name="משתנים" custom="VARIABLE"></category>
    <category name="פונקציות" custom="PROCEDURE"></category>
  </xml>

  <script>
    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: document.getElementById('toolbox'),
      rtl: true,
      scrollbars: true
    });

    function showCode() {
      const code = Blockly.Python.workspaceToCode(workspace);
      document.getElementById('codeArea').textContent = code;
    }

    function runCode() {
      const code = Blockly.Python.workspaceToCode(workspace);
      alert("הקוד שנוצר (לא מורץ בפועל):\n\n" + code);
    }
  </script>
</body>
</html>
