<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>ברוך הבא למערכת מבוא לתכנות</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(to bottom, #f0f4fa, #e1e9f3);
      color: #1a1a1a;
      direction: rtl;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2em;
    }

    header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
      align-items: center;
    }

    header img {
      height: 48px;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 1em;
    }

    .login-box {
      background: white;
      padding: 2em;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-box input {
      font-size: 1em;
      padding: 0.6em;
      width: 100%;
      margin-bottom: 1em;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .login-box button {
      background: #0074d9;
      color: white;
      font-size: 1em;
      padding: 0.6em 1.2em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .login-box button:hover {
      background: #005fa3;
    }

    .footer {
      margin-top: 3em;
      font-size: 0.9em;
      color: #666;
    }

  </style>
</head>
<body>
  <header>
    <img src="Techni Logo.png" alt="לוגו">
  </header>

  <main>
    <h1>ברוך הבא למערכת מבוא לתכנות</h1>
    <div class="login-box">
      <label for="personalId">אנא הזן את המספר האישי שלך:</label>
      <input type="text" id="personalId" placeholder="מספר אישי">
      <button onclick="login()">התחל</button>
    </div>
  </main>

  <div class="footer">
    <a href="#">כניסת מורה</a>
  </div>

  <script>
    function login() {
      const id = document.getElementById("personalId").value.trim();
      if (id.length === 0) {
        alert("אנא הזן מספר אישי");
        return;
      }

      // שמור את המספר האישי בזיכרון
      localStorage.setItem("personalId", id);

      // נווט לדף הבית של המשתמש (נבנה בהמשך)
      window.location.href = "dashboard.html";
    }
  </script>
</body>
</html>
