<!DOCTYPE html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <title>עורך Blockly לפייתון</title>
    <script src="blockly/blockly_compressed.js"></script>
    <script src="blockly/blocks_compressed.js"></script>
    <script src="blockly/python_compressed.js"></script>
    <script src="blockly/msg/js/he.js"></script>
    <style>
      body {
        margin: 0;
        direction: rtl;
        font-family: sans-serif;
      }
      #header {
        background-color: #e3f2fd;
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #buttons {
        display: flex;
        gap: 10px;
      }
      #buttons button {
        padding: 6px 12px;
        font-weight: bold;
      }
      #logo {
        height: 40px;
      }
      #blocklyDiv {
        height: calc(100vh - 50px);
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <img id="logo" src="Techni Logo.png" alt="לוגו חיל האוויר" />
      <div id="buttons">
        <button onclick="showCode()">הצג קוד פייתון</button>
        <button onclick="downloadCode()">הורד קובץ</button>
        <button onclick="saveXml()">שמור פרויקט</button>
        <button onclick="loadXml()">טען פרויקט</button>
        <input type="file" id="fileInput" accept=".xml" style="display: none" />
      </div>
    </div>
    <div id="blocklyDiv"></div>

    <xml id="toolbox" style="display: none">
      <category name="לוגיקה" colour="%{BKY_LOGIC_HUE}">
        <block type="controls_if"></block>
        <block type="logic_compare"></block>
        <block type="logic_operation"></block>
        <block type="logic_negate"></block>
        <block type="logic_boolean"></block>
        <block type="logic_null"></block>
        <block type="logic_ternary"></block>
      </category>
      <category name="לולאות" colour="%{BKY_LOOPS_HUE}">
        <block type="controls_repeat_ext">
          <value name="TIMES">
            <shadow type="math_number"><field name="NUM">10</field></shadow>
          </value>
        </block>
        <block type="controls_whileUntil"></block>
      </category>
      <category name="מתמטיקה" colour="%{BKY_MATH_HUE}">
        <block type="math_number"><field name="NUM">0</field></block>
        <block type="math_arithmetic"></block>
        <block type="math_single"></block>
      </category>
      <category name="משתנים" custom="VARIABLE" colour="%{BKY_VARIABLES_HUE}"></category>
      <category name="פונקציות" custom="PROCEDURE" colour="%{BKY_PROCEDURES_HUE}"></category>
    </xml>

    <script>
      const workspace = Blockly.inject("blocklyDiv", {
        toolbox: document.getElementById("toolbox"),
        rtl: true,
        scrollbars: true,
      });

      function showCode() {
        const code = Blockly.Python.workspaceToCode(workspace);
        alert(code);
      }

      function downloadCode() {
        const code = Blockly.Python.workspaceToCode(workspace);
        const blob = new Blob([code], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "code.py";
        a.click();
      }

      function saveXml() {
        const xml = Blockly.Xml.workspaceToDom(workspace);
        const xmlText = Blockly.Xml.domToPrettyText(xml);
        const blob = new Blob([xmlText], { type: "text/xml" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "project.xml";
        a.click();
      }

      function loadXml() {
        document.getElementById("fileInput").click();
      }

      document.getElementById("fileInput").addEventListener("change", function (e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
          const xmlText = e.target.result;
          const xml = Blockly.Xml.textToDom(xmlText);
          Blockly.Xml.domToWorkspace(xml, workspace);
        };
        reader.readAsText(file);
      });
    </script>
  </body>
</html>
