
<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="utf-8">
  <title>עורך Blockly לפייתון</title>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/python.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f0f8ff;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #dff0ff;
      padding: 10px 20px;
    }
    header img {
      height: 40px;
    }
    header .buttons {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 8px 14px;
      background-color: #0d6efd;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0b5ed7;
    }
    #blocklyDiv {
      height: calc(100vh - 60px);
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <img src="Techni Logo.png" alt="Technological College Logo">
    <div class="buttons">
      <button onclick="showCode()">הצג קוד פייתון</button>
      <button onclick="downloadPython()">הורד קובץ</button>
      <button onclick="loadProject()">טען פרויקט</button>
    </div>
  </header>
  <div id="blocklyDiv"></div>
  <input type="file" id="fileInput" accept=".xml" style="display:none">

  <xml id="toolbox" style="display: none">
    <category name="משתנים" colour="#A65E2E" custom="VARIABLE"></category>
    <category name="לוגיקה" colour="#5C81A6">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_boolean"></block>
    </category>
    <category name="לולאות" colour="#5CA65C">
      <block type="controls_repeat_ext">
        <value name="TIMES">
          <shadow type="math_number">
            <field name="NUM">10</field>
          </shadow>
        </value>
      </block>
      <block type="controls_whileUntil"></block>
    </category>
    <category name="מתמטיקה" colour="#5C68A6">
      <block type="math_number"><field name="NUM">0</field></block>
      <block type="math_arithmetic"></block>
    </category>
    <category name="פלט" colour="#745CA6">
      <block type="text_print"></block>
    </category>
  </xml>

  <script>
    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: document.getElementById('toolbox'),
      rtl: true,
      scrollbars: true
    });

    function showCode() {
      const code = Blockly.Python.workspaceToCode(workspace);
      alert(code);
    }

    function downloadPython() {
      const code = Blockly.Python.workspaceToCode(workspace);
      const blob = new Blob([code], {type: 'text/x-python'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'project.py';
      a.click();
      URL.revokeObjectURL(url);
    }

    function loadProject() {
      document.getElementById('fileInput').click();
    }

    document.getElementById('fileInput').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const xml = Blockly.Xml.textToDom(e.target.result);
          workspace.clear();
          Blockly.Xml.domToWorkspace(xml, workspace);
          alert("הפרויקט נטען בהצלחה!");
        } catch (err) {
          alert("שגיאה בטעינת הפרויקט: ודא שהקובץ תקין ונשמר מהמערכת.");
        }
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
