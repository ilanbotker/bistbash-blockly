<body>
  <div id="blocklyDiv"></div>

  

  <div id="notification"></div>

  <xml id="toolbox" style="display: none">
    <category name="לוגיקה">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_negate"></block>
      <block type="logic_boolean"></block>
    </category>
    <category name="לולאות">
      <block type="controls_repeat_ext"></block>
      <block type="controls_whileUntil"></block>
      <block type="controls_for"></block>
    </category>
    <category name="מתמטיקה">
      <block type="math_number"></block>
      <block type="math_arithmetic"></block>
    </category>
    <category name="טקסט">
      <block type="text"></block>
      <block type="text_print"></block>
    </category>
    <category name="משתנים" custom="VARIABLE"></category>
    <category name="פונקציות" custom="PROCEDURE"></category>
  </xml>

  <script>
    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: document.getElementById('toolbox'),
      rtl: true,
      scrollbars: true
    });

    function showNotification(message, type = "info") {
      const notification = document.getElementById("notification");
      notification.className = type;
      notification.textContent = message;
      notification.style.display = "block";
      setTimeout(() => {
        notification.style.display = "none";
      }, 3000);
    }

    function showCode() {
      try {
        const code = Blockly.Python.workspaceToCode(workspace);
        navigator.clipboard.writeText(code);
        showNotification("קוד פייתון הועתק ללוח", "info");
      } catch {
        showNotification("שגיאה בהצגת הקוד", "error");
      }
    }

    function downloadCode() {
      try {
        const code = Blockly.Python.workspaceToCode(workspace);
        const blob = new Blob([code], { type: 'text/x-python' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'תרגיל.py';
        a.click();
        showNotification("קובץ פייתון הורד בהצלחה", "success");
      } catch {
        showNotification("שגיאה בהורדת הקובץ", "error");
      }
    }

    function saveProject() {
      try {
        const xml = Blockly.Xml.workspaceToDom(workspace);
        const xmlText = Blockly.Xml.domToPrettyText(xml);
        const blob = new Blob([xmlText], { type: 'text/xml' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'פרויקט.xml';
        a.click();
        showNotification("הפרויקט נשמר בהצלחה", "success");
      } catch {
        showNotification("שגיאה בשמירת הפרויקט", "error");
      }
    }

    function loadProject(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const xmlText = e.target.result;
          const parser = new DOMParser();
          const xml = parser.parseFromString(xmlText, "text/xml");
          Blockly.Xml.domToWorkspace(xml.documentElement, workspace);
          showNotification("הפרויקט נטען בהצלחה", "success");
        } catch {
          showNotification("שגיאה בטעינת הפרויקט", "error");
        }
      };
      reader.readAsText(file);
    }
  </script>

<div id="variableModal">
  <div id="variableModalContent">
    <h2>שם המשתנה החדש:</h2>
    <input type="text" id="varNameInput" placeholder="הכנס שם משתנה" />
    <br />
    <button id="confirmCreateVar">אישור</button>
    <button id="cancelCreateVar">ביטול</button>
  </div>
</div>

<script>
  const modal = document.getElementById("variableModal");
  const input = document.getElementById("varNameInput");
  const confirmBtn = document.getElementById("confirmCreateVar");
  const cancelBtn = document.getElementById("cancelCreateVar");

  let workspaceRef = null;

  // Capture variable create request
  Blockly.Variables.createVariable = function(workspace) {
    workspaceRef = workspace;
    input.value = "";
    modal.style.display = "block";
    modal.querySelector("div").classList.add("fade-in");
    setTimeout(() => modal.querySelector("div").classList.remove("fade-in"), 300);
    input.focus();
  };

  confirmBtn.onclick = function() {
    const name = input.value.trim();
    if (name && workspaceRef) {
      Blockly.Variables.createVariableButtonHandler(workspaceRef, null, name);
    }
    modal.style.display = "none";
  };

  cancelBtn.onclick = function() {
    modal.style.display = "none";
  };

  // Close modal with ESC
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") modal.style.display = "none";
  });
</script>

<div id="outputModal" style="display:none; position:fixed; z-index:3000; top:0; right:0; bottom:0; left:0; background-color: rgba(0,0,0,0.7);">
  <div style="background-color:#111; color:#0f0; max-width:600px; margin:5% auto; padding:20px; border-radius:12px; font-family:monospace; position:relative;">
    <h3 style="color:white; margin-top:0;">פלט התוכנית:</h3>
    <div id="output" style="max-height:300px; overflow-y:auto; background:#000; padding:10px; border-radius:6px; border:1px solid #444;"></div>
    <button onclick="closeOutput()" style="margin-top:15px; padding:10px 20px; background-color:#444; color:white; border:none; border-radius:6px; cursor:pointer;">סגור</button>
  </div>
</div>


<script>
  function runCode() {
    console.log("🔧 runCode התחיל");
    const outputDiv = document.getElementById("output");
    const modal = document.getElementById("outputModal");
    outputDiv.innerHTML = '';
    modal.style.display = "block";
    modal.querySelector("div").classList.add("fade-in");
    setTimeout(() => modal.querySelector("div").classList.remove("fade-in"), 300);

    let code = "";
    try {
      code = Blockly.Python.workspaceToCode(workspace);
    } catch (e) {
      console.error("שגיאה בתרגום בלוקים:", e);
      outputDiv.innerHTML = '<span style="color:red;">שגיאה בתרגום בלוקים</span>';
      return;
    }

    Sk.configure({
      output: function(text) {
        outputDiv.innerHTML += text + "<br>";
      },
      read: function(x) {
        if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
          throw "File not found: '" + x + "'";
        return Sk.builtinFiles["files"][x];
      }
    });

    Sk.misceval.asyncToPromise(function() {
      return Sk.importMainWithBody("<stdin>", false, code, true);
    }).catch(function(err) {
      console.error("שגיאה בהרצה:", err.toString());
      outputDiv.innerHTML += '<span style="color:red;">שגיאה בהרצה: ' + err.toString() + '</span>';
    });
  }

  function closeOutput() {
    document.getElementById("outputModal").style.display = "none";
  }
</script>

<div id="controls">
  <button onclick="runCode()">▶️ הרץ קוד</button>
  <label for="fileInput">📂 טען פרויקט</label>
  <button onclick="saveProject()">💾 שמור פרויקט</button>
  <button onclick="showCode()">📋 הצג קוד פייתון</button>
  <button onclick="downloadCode()">⬇️ הורד קובץ פייתון</button>
  <input type="file" id="fileInput" accept=".xml" onchange="loadProject(event)">
</div>
