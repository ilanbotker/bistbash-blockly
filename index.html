<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>כניסה למערכת התרגול</title>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js"></script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f0f4f8;
    }
    .container {
      text-align: center;
      background: white;
      padding: 2em;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input {
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 15px;
      background-color: #1976d2;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #125ca1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>כניסה למערכת התרגול</h2>
    <input type="text" id="personalId" placeholder="הכנס מספר אישי">
    <br>
    <button onclick="login()">התחל</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAKsIjS9Ko81cfiLvrmV2tgCShrN6MJQqM"
authDomain: "blockly-b7cde.firebaseapp.com"
projectId: "blockly-b7cde"
storageBucket: "blockly-b7cde.firebasestorage.app"
messagingSenderId: "704926970997"
appId: "1:704926970997:web:11c1f4a9850a65b08a743c"
measurementId: "G-DQRKPM6BN2"
    };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(app);

    async function login() {
      const id = document.getElementById("personalId").value.trim();
      if (!id) {
        alert("אנא הזן מספר אישי");
        return;
      }

      try {
        const docRef = db.collection("users").doc(id);
        const doc = await docRef.get();
        if (doc.exists) {
          const name = doc.data().name;
          localStorage.setItem("personalId", id);
          localStorage.setItem("userName", name);
          window.location.href = "dashboard.html";
        } else {
          alert("לא נמצא משתמש עם מספר אישי זה");
        }
      } catch (error) {
        console.error("שגיאה בגישה ל-Firebase:", error);
        alert("שגיאה בעת התחברות");
      }
    }
  </script>
</body>
</html>
