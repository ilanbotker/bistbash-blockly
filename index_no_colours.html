
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Blockly בעברית עם פייתון</title>
  <script src="blockly/blockly_compressed.js"></script>
  <script src="blockly/blocks_compressed.js"></script>
<script src="blockly/blocks/colour.js"></script>
  <script src="blockly/python_compressed.js"></script>
  <script src="blockly/msg/js/he.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      direction: rtl;
      background-color: rgb(10,10,55);
      color: white;
    }

    #blocklyDiv {
      height: calc(100% - 100px);
      width: 100%;
      background-color: rgb(130,142,150);
    }

    #controls {
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 1em;
      gap: 1em;
      background-color: rgb(10,10,55);
      box-shadow: 0 -2px 8px rgba(0,0,0,0.4);
      position: fixed;
      bottom: 0;
      width: 100%;
    }

    button, label[for="fileInput"] {
      padding: 12px 24px;
      font-size: 16px;
      color: white;
      background-color: rgb(65,126,200);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover, label[for="fileInput"]:hover {
      background-color: rgb(65,145,222);
      transform: scale(1.05);
    }

    input[type="file"] {
      display: none;
    }

    #notification {
      position: fixed;
      bottom: 110px;
      right: 20px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      display: none;
      z-index: 1000;
    }

    .success {
      background-color: #28a745;
      color: white;
    }

    .error {
      background-color: #dc3545;
      color: white;
    }

    .info {
      background-color: #007bff;
      color: white;
    }
  
<style>
  .blocklyToolboxDiv {
    background-color: rgb(10,10,55) !important;
    color: white !important;
  }

  .blocklyTreeLabel {
    color: white !important;
    font-size: 16px;
  }

  .blocklyTreeLabel:hover {
    color: rgb(65,145,222) !important;
  }

  .blocklyTreeSelected > .blocklyTreeLabel {
    background-color: rgb(65,126,200) !important;
    color: white !important;
  }

  .blocklyTreeRow {
    padding: 4px 10px !important;
  }

<style>
  .blocklyToolboxDiv {
    background-color: rgb(10,10,55) !important;
    color: white !important;
    border-left: 2px solid rgb(65,145,222) !important;
  }

  .blocklyTreeRow {
    background-color: rgb(10,10,55) !important;
    padding: 6px 16px !important;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .blocklyTreeLabel {
    color: white !important;
    font-size: 17px;
    font-weight: 500;
  }

  .blocklyTreeRow:hover .blocklyTreeLabel {
    color: rgb(65,145,222) !important;
  }

  .blocklyTreeSelected {
    background-color: rgb(65,126,200) !important;
    border-right: 4px solid rgb(65,145,222);
  }

  .blocklyTreeSelected .blocklyTreeLabel {
    color: white !important;
  }
</style>
</style>
</style>
</head>
<body>
  <div id="blocklyDiv"></div>

  <div id="controls">
    <button onclick="showCode()">הצג קוד פייתון</button>
    <button onclick="downloadCode()">הורד קובץ פייתון</button>
    <button onclick="saveProject()">שמור פרויקט</button>
    <label for="fileInput">טען פרויקט</label>
    <input type="file" id="fileInput" accept=".xml" onchange="loadProject(event)">
  </div>

  <div id="notification"></div>

  
<xml id="toolbox" style="display: none">
  <category name="לוגיקה" colour="%{BKY_LOGIC_HUE}">
    <block type="controls_if"></block>
    <block type="logic_compare"></block>
    <block type="logic_operation"></block>
    <block type="logic_negate"></block>
    <block type="logic_boolean"></block>
    <block type="logic_null"></block>
    <block type="logic_ternary"></block>
  </category>
  <category name="לולאות" colour="%{BKY_LOOPS_HUE}">
    <block type="controls_repeat_ext">
      <value name="TIMES">
        <shadow type="math_number">
          <field name="NUM">10</field>
        </shadow>
      </value>
    </block>
    <block type="controls_whileUntil"></block>
    <block type="controls_for">
      <value name="FROM">
        <shadow type="math_number">
          <field name="NUM">1</field>
        </shadow>
      </value>
      <value name="TO">
        <shadow type="math_number">
          <field name="NUM">10</field>
        </shadow>
      </value>
      <value name="BY">
        <shadow type="math_number">
          <field name="NUM">1</field>
        </shadow>
      </value>
    </block>
    <block type="controls_forEach"></block>
    <block type="controls_flow_statements"></block>
  </category>
  <category name="מתמטיקה" colour="%{BKY_MATH_HUE}">
    <block type="math_number"></block>
    <block type="math_arithmetic"></block>
    <block type="math_single"></block>
    <block type="math_trig"></block>
    <block type="math_constant"></block>
    <block type="math_number_property"></block>
    <block type="math_round"></block>
    <block type="math_on_list"></block>
    <block type="math_modulo"></block>
    <block type="math_constrain">
      <value name="LOW">
        <shadow type="math_number">
          <field name="NUM">1</field>
        </shadow>
      </value>
      <value name="HIGH">
        <shadow type="math_number">
          <field name="NUM">100</field>
        </shadow>
      </value>
    </block>
    <block type="math_random_int">
      <value name="FROM">
        <shadow type="math_number">
          <field name="NUM">1</field>
        </shadow>
      </value>
      <value name="TO">
        <shadow type="math_number">
          <field name="NUM">100</field>
        </shadow>
      </value>
    </block>
    <block type="math_random_float"></block>
    <block type="math_atan2"></block>
  </category>
  <category name="טקסט" colour="%{BKY_TEXTS_HUE}">
    <block type="text"></block>
    <block type="text_join"></block>
    <block type="text_append">
      <value name="TEXT">
        <shadow type="text"></shadow>
      </value>
    </block>
    <block type="text_length">
      <value name="VALUE">
        <shadow type="text"></shadow>
      </value>
    </block>
    <block type="text_isEmpty">
      <value name="VALUE">
        <shadow type="text"></shadow>
      </value>
    </block>
    <block type="text_indexOf">
      <value name="VALUE">
        <block type="variables_get">
          <field name="VAR">טקסט</field>
        </block>
      </value>
      <value name="FIND">
        <shadow type="text"></shadow>
      </value>
    </block>
    <block type="text_charAt">
      <value name="VALUE">
        <block type="variables_get">
          <field name="VAR">טקסט</field>
        </block>
      </value>
    </block>
    <block type="text_getSubstring">
      <value name="STRING">
        <block type="variables_get">
          <field name="VAR">טקסט</field>
        </block>
      </value>
    </block>
    <block type="text_changeCase">
      <value name="TEXT">
        <shadow type="text"></shadow>
      </value>
    </block>
    <block type="text_trim">
      <value name="TEXT">
        <shadow type="text"></shadow>
      </value>
    </block>
    <block type="text_print">
      <value name="TEXT">
        <shadow type="text"></shadow>
      </value>
    </block>
    <block type="text_prompt_ext">
      <value name="TEXT">
        <shadow type="text"></shadow>
      </value>
    </block>
  </category>
  <category name="רשימות" colour="%{BKY_LISTS_HUE}">
    <block type="lists_create_with">
      <mutation items="0"></mutation>
    </block>
    <block type="lists_create_with"></block>
    <block type="lists_repeat">
      <value name="NUM">
        <shadow type="math_number">
          <field name="NUM">5</field>
        </shadow>
      </value>
    </block>
    <block type="lists_length"></block>
    <block type="lists_isEmpty"></block>
    <block type="lists_indexOf">
      <value name="VALUE">
        <block type="variables_get">
          <field name="VAR">רשימה</field>
        </block>
      </value>
    </block>
    <block type="lists_getIndex"></block>
    <block type="lists_setIndex"></block>
    <block type="lists_getSublist"></block>
    <block type="lists_split">
      <value name="DELIM">
        <shadow type="text">
          <field name="TEXT">,</field>
        </shadow>
      </value>
    </block>
    <block type="lists_sort"></block>
    <block type="lists_reverse"></block>
  </category>
  <category name="משתנים" custom="VARIABLE" colour="%{BKY_VARIABLES_HUE}"></category>
  <category name="פונקציות" custom="PROCEDURE" colour="%{BKY_PROCEDURES_HUE}"></category>
</xml>

  <script>
    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: document.getElementById('toolbox'),
      rtl: true,
      scrollbars: true
    });

    function showNotification(message, type = "info") {
      const notification = document.getElementById("notification");
      notification.className = type;
      notification.textContent = message;
      notification.style.display = "block";
      setTimeout(() => {
        notification.style.display = "none";
      }, 3000);
    }

    function showCode() {
      try {
        const code = Blockly.Python.workspaceToCode(workspace);
        navigator.clipboard.writeText(code);
        showNotification("קוד פייתון הועתק ללוח", "info");
      } catch {
        showNotification("שגיאה בהצגת הקוד", "error");
      }
    }

    function downloadCode() {
      try {
        const code = Blockly.Python.workspaceToCode(workspace);
        const blob = new Blob([code], { type: 'text/x-python' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'תרגיל.py';
        a.click();
        showNotification("קובץ פייתון הורד בהצלחה", "success");
      } catch {
        showNotification("שגיאה בהורדת הקובץ", "error");
      }
    }

    function saveProject() {
      try {
        const xml = Blockly.Xml.workspaceToDom(workspace);
        const xmlText = Blockly.Xml.domToPrettyText(xml);
        const blob = new Blob([xmlText], { type: 'text/xml' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'פרויקט.xml';
        a.click();
        showNotification("הפרויקט נשמר בהצלחה", "success");
      } catch {
        showNotification("שגיאה בשמירת הפרויקט", "error");
      }
    }

    function loadProject(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const xmlText = e.target.result;
          const parser = new DOMParser();
          const xml = parser.parseFromString(xmlText, "text/xml");
          Blockly.Xml.domToWorkspace(xml.documentElement, workspace);
          showNotification("הפרויקט נטען בהצלחה", "success");
        } catch {
          showNotification("שגיאה בטעינת הפרויקט", "error");
        }
      };
      reader.readAsText(file);
    }
  </script>

<style>
  #variableModal {
    display: none;
    position: fixed;
    z-index: 2000;
    right: 0; left: 0;
    top: 0; bottom: 0;
    background-color: rgba(0, 0, 0, 0.7);
  }

  #variableModalContent {
    background-color: #fff;
    color: #000;
    margin: 10% auto;
    padding: 20px;
    border-radius: 12px;
    width: 300px;
    text-align: center;
    font-family: "Segoe UI", Arial, sans-serif;
  }

  #variableModalContent h2 {
    font-size: 20px;
    margin-bottom: 10px;
  }

  #variableModalContent input {
    width: 90%;
    padding: 8px;
    font-size: 16px;
    margin-bottom: 15px;
  }

  #variableModalContent button {
    padding: 8px 16px;
    margin: 0 5px;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  #confirmCreateVar {
    background-color: rgb(65,126,200);
    color: white;
  }

  #cancelCreateVar {
    background-color: #ccc;
  }
</style>

<div id="variableModal">
  <div id="variableModalContent">
    <h2>שם המשתנה החדש:</h2>
    <input type="text" id="varNameInput" placeholder="הכנס שם משתנה" />
    <br />
    <button id="confirmCreateVar">אישור</button>
    <button id="cancelCreateVar">ביטול</button>
  </div>
</div>

<script>
  const modal = document.getElementById("variableModal");
  const input = document.getElementById("varNameInput");
  const confirmBtn = document.getElementById("confirmCreateVar");
  const cancelBtn = document.getElementById("cancelCreateVar");

  let workspaceRef = null;

  // Capture variable create request
  Blockly.Variables.createVariable = function(workspace) {
    workspaceRef = workspace;
    input.value = "";
    modal.style.display = "block";
    input.focus();
  };

  confirmBtn.onclick = function() {
    const name = input.value.trim();
    if (name && workspaceRef) {
      Blockly.Variables.createVariableButtonHandler(workspaceRef, null, name);
    }
    modal.style.display = "none";
  };

  cancelBtn.onclick = function() {
    modal.style.display = "none";
  };

  // Close modal with ESC
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") modal.style.display = "none";
  });
</script>

<style>
  #techniLogo {
    max-width: 80px;
    max-height: 80px;
    object-fit: contain;
    position: fixed;
    bottom: 10px;
    right: 10px;
    width: 120px;

<img id="techniLogo" src="Techni Logo.png" alt="Techni Logo">

</body>
